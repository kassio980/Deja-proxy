<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEJA PROXY</title>
    <style>
        :root {
            --neon-purple: #b026ff;
            --neon-blue: #00d9ff;
            --dark-bg: #050505;
            --panel-bg: #0a0a0a;
            --text-color: #fff;
            --glow: 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple);
            --glow-blue: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #222 0%, #050505 70%);
        }

        h1 {
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-color);
            text-shadow: var(--glow);
            margin-bottom: 30px;
            border-bottom: 2px solid var(--neon-purple);
            padding-bottom: 15px;
            position: relative;
        }
        
        h1 span {
            color: var(--neon-purple);
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.2);
            border: 1px solid #222;
            position: relative;
            overflow: hidden;
        }

        /* Linhas decorativas */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-purple), transparent);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 8px rgba(176, 38, 255, 0.4);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #4a00e0, var(--neon-purple));
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 10px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .status-box {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
            font-family: 'Courier New', monospace;
            color: #0f0;
            min-height: 60px;
            border: 1px solid #333;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .hacks-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
        }

        .hack-btn {
            background: #151515;
            border: 1px solid var(--neon-purple);
            color: #888;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            text-align: center;
        }

        .hack-btn:hover {
            background: #222;
            color: #fff;
        }

        .hack-btn.active {
            background: var(--neon-purple);
            color: #000;
            box-shadow: 0 0 15px var(--neon-purple);
            border-color: var(--neon-purple);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #555;
            text-align: center;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 10px var(--neon-purple); }
            50% { text-shadow: 0 0 20px var(--neon-purple), 0 0 30px var(--neon-purple); }
            100% { text-shadow: 0 0 10px var(--neon-purple); }
        }

        .pulse-text {
            animation: pulse 2s infinite;
        }

        /* Estilo para API Key */
        .api-section {
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        
        .api-display {
            margin-top: 10px;
            font-family: monospace;
            background: #111;
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            color: var(--neon-blue);
            border: 1px dashed var(--neon-blue);
            display: none;
        }

        .btn-secondary {
            background: #222;
            border: 1px solid #444;
            color: #ccc;
            font-size: 0.9rem;
            padding: 12px;
        }
        
        .btn-secondary:hover {
            background: #333;
            color: #fff;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <h1>DEJA <span class="pulse-text">PROXY</span></h1>

    <div class="container">
        <!-- Conexão -->
        <div class="input-group">
            <label>IP do Dispositivo (Wi-Fi Debug)</label>
            <input type="text" id="deviceIp" placeholder="Ex: 192.168.1.100">
        </div>
        
        <div class="input-group">
            <label>Porta (ADB)</label>
            <input type="number" id="devicePort" placeholder="5555" value="5555">
        </div>

        <button class="btn" onclick="connectDevice()">Conectar ao Proxy</button>

        <div id="status" class="status-box">Aguardando conexão...</div>

        <!-- Hacks -->
        <div class="hacks-grid">
            <button class="hack-btn" id="headshot" onclick="toggleHack('headshot')">HS Cabeça</button>
            <button class="hack-btn" id="neck" onclick="toggleHack('neck')">HS Pescoço</button>
            <button class="hack-btn" id="aimbot" onclick="toggleHack('aimbot')">Aimbot</button>
            <button class="hack-btn" id="esp" onclick="toggleHack('esp')">ESP (Linha)</button>
            <button class="hack-btn" id="fly" onclick="toggleHack('fly')">Voo</button>
            <button class="hack-btn" id="speed" onclick="toggleHack('speed')">Speed Run</button>
        </div>

        <div style="margin-top: 20px;">
            <button class="btn" onclick="applyAll()" style="background: linear-gradient(45deg, #ff00ff, #800080);">ATIVAR TUDO PERMANENTE</button>
        </div>

        <!-- API Section -->
        <div class="api-section">
            <label>Gerenciamento de Acesso</label>
            <button class="btn btn-secondary" onclick="generateKey()">Gerar Nova API Key</button>
            <div id="apiKeyDisplay" class="api-display"></div>
        </div>
    </div>

    <div class="footer">
        DEJA PROXY v2.0 | Wi-Fi Debug Mode | 100% Undetected
    </div>

    <script>
        // Conexão WebSocket
        const ws = new WebSocket('ws://' + window.location.host);
        let isConnected = false;

        ws.onopen = () => {
            console.log('WebSocket Conectado');
            updateStatus('Conectado ao Servidor DEJA. Aguardando dispositivo...');
            isConnected = true;
        };

        ws.onclose = () => {
            console.log('WebSocket Desconectado');
            updateStatus('Servidor desconectado. Recarregue a página.');
            isConnected = false;
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'ack') {
                updateStatus(`[${data.action.toUpperCase()}]: ${data.message}`);
            } else if (data.type === 'device_connected') {
                updateStatus(`Dispositivo ${data.device_id} Online! Pronto para injeção.`);
                document.getElementById('status').style.color = '#0f0';
            } else if (data.type === 'error') {
                updateStatus('Erro: ' + data.message);
                document.getElementById('status').style.color = '#f00';
            }
        };

        function connectDevice() {
            const ip = document.getElementById('deviceIp').value;
            const port = document.getElementById('devicePort').value;
            
            if (!ip || !port) {
                alert('Insira IP e Porta!');
                return;
            }

            updateStatus(`Conectando ao ${ip}:${port}...`);
            document.getElementById('status').style.color = '#fff';

            setTimeout(() => {
                if (!isConnected) {
                    updateStatus('Erro: Conecte-se ao servidor primeiro.');
                    return;
                }
                ws.send(JSON.stringify({
                    type: 'connect_device',
                    device_id: `${ip}:${port}`
                }));
            }, 1000);
        }

        function toggleHack(hackId) {
            const btn = document.getElementById(hackId);
            const isActive = btn.classList.toggle('active');
            
            if (!isConnected) {
                updateStatus('Servidor desconectado.');
                return;
            }

            ws.send(JSON.stringify({
                type: 'inject_hack',
                hack_type: hackId,
                status: isActive
            }));

            updateStatus(`${hackId.toUpperCase()}: ${isActive ? 'ON' : 'OFF'}`);
        }

        function applyAll() {
            const hacks = ['headshot', 'neck', 'aimbot', 'esp', 'fly', 'speed'];
            hacks.forEach(h => {
                const btn = document.getElementById(h);
                btn.classList.add('active');
                ws.send(JSON.stringify({
                    type: 'inject_hack',
                    hack_type: h,
                    status: true
                }));
            });
            updateStatus('TODOS OS HACKS ATIVOS - MODO DEUS');
        }

        async function generateKey() {
            try {
                updateStatus('Gerando chave API...');
                const response = await fetch('/api/generate-key');
                const data = await response.json();
                if(data.success) {
                    const display = document.getElementById('apiKeyDisplay');
                    display.style.display = 'block';
                    display.innerText = data.apiKey;
                    updateStatus(`API Key gerada com sucesso!`);
                } else {
                    alert('Erro ao gerar chave');
                }
            } catch (error) {
                console.error('Erro:', error);
                updateStatus('Erro ao conectar com API.');
            }
        }

        function updateStatus(msg) {
            const el = document.getElementById('status');
            el.innerText = msg;
            if (msg.includes('ON') || msg.includes('Online') || msg.includes('sucesso')) {
                el.style.color = '#0f0';
            } else if (msg.includes('Erro') || msg.includes('Erro:')) {
                el.style.color = '#f00';
            } else {
                el.style.color = '#ccc';
            }
        }
    </script>
</body>
</html>
