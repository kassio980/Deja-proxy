<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEJA PROXY - Painel Admin</title>
    <style>
        :root {
            --bg: #050505; --panel: #0f0f0f; --primary: #b026ff; --secondary: #ff00ff;
            --text: #e0e0e0; --muted: #666; --glow: 0 0 15px rgba(176, 38, 255, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #login-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .login-box { background: var(--panel); padding: 40px; border-radius: 12px; border: 1px solid #333; width: 350px; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .login-box h2 { color: var(--primary); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; }
        input:focus { border-color: var(--primary); box-shadow: var(--glow); }
        .btn { width: 100%; padding: 12px; background: var(--primary); border: none; color: #fff; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; transition: 0.2s; }
        .btn:hover { background: #9000e0; box-shadow: var(--glow); }
        .btn-small { padding: 5px 10px; font-size: 0.8rem; width: auto; }
        .btn-danger { background: #ff4444; }
        #main-panel { display: none; height: 100%; display: flex; }
        .sidebar { width: 250px; background: var(--panel); border-right: 1px solid #222; display: flex; flex-direction: column; padding: 20px; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin-bottom: 30px; text-shadow: var(--glow); }
        .menu-item { padding: 12px; cursor: pointer; border-radius: 6px; margin-bottom: 5px; transition: 0.2s; display: flex; justify-content: space-between; }
        .menu-item:hover, .menu-item.active { background: rgba(176, 38, 255, 0.1); color: var(--primary); }
        .api-key-display { font-size: 0.8rem; color: var(--muted); word-break: break-all; margin-top: 10px; background: #000; padding: 10px; border-radius: 4px; }
        .content { flex: 1; padding: 30px; overflow-y: auto; background: #080808; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 20px; }
        .status-dot { width: 10px; height: 10px; background: #0f0; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .devices-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .device-card { background: var(--panel); border: 1px solid #333; padding: 20px; border-radius: 10px; position: relative; }
        .device-card.online { border-color: var(--primary); box-shadow: 0 0 10px rgba(176, 38, 255, 0.2); }
        .device-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .device-hacks { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 15px; }
        .hack-tag { font-size: 0.7rem; padding: 4px 8px; background: #222; border-radius: 4px; color: #aaa; }
        .hack-tag.active { background: var(--primary); color: #000; font-weight: bold; }
        .console { background: #000; height: 150px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 0.8rem; color: #0f0; border: 1px solid #333; margin-top: 20px; border-radius: 6px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2>DEJA PROXY</h2>
            <input type="text" id="username" placeholder="Usuário">
            <input type="text" id="apiKey" placeholder="API Key (Deixe vazio para criar)">
            <button class="btn" onclick="login()">Entrar</button>
        </div>
    </div>
    <div id="main-panel" class="hidden">
        <div class="sidebar">
            <div class="logo">DEJA<span style="color:#fff">.PROXY</span></div>
            <div class="menu-item active" onclick="showSection('devices')">📡 Dispositivos</div>
            <div class="menu-item" onclick="showSection('hacks')">🎯 Hacks Globais</div>
            <div class="menu-item" onclick="logout()">🚪 Sair</div>
            <div style="margin-top: auto;">
                <small>Sua API Key:</small>
                <div id="userApiKey" class="api-key-display">...</div>
            </div>
        </div>
        <div class="content">
            <div class="header">
                <h2 id="section-title">Dispositivos Conectados</h2>
                <button class="btn btn-small" onclick="addDevice()">+ Adicionar Dispositivo</button>
            </div>
            <div id="devices-list" class="devices-grid"></div>
            <div id="hacks-list" class="hidden" style="margin-top: 20px;">
                <h3>Catálogo de Hacks</h3>
                <div id="hacks-container" style="margin-top: 15px;"></div>
            </div>
            <div class="console" id="console-log">> Aguardando eventos...</div>
        </div>
    </div>
    <script>
        let API_KEY = localStorage.getItem('deja_api_key');
        let USERNAME = localStorage.getItem('deja_user');
        const loginScreen = document.getElementById('login-screen');
        const mainPanel = document.getElementById('main-panel');
        const consoleLog = document.getElementById('console-log');

        if (API_KEY && USERNAME) loadPanel();

        async function login() {
            const u = document.getElementById('username').value;
            const k = document.getElementById('apiKey').value;
            const res = await fetch('/api/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, apiKey: k || undefined })
            });
            const data = await res.json();
            if (data.success) {
                API_KEY = data.apiKey; USERNAME = u;
                localStorage.setItem('deja_api_key', API_KEY);
                localStorage.setItem('deja_user', USERNAME);
                loadPanel();
            } else alert(data.message);
        }

        function loadPanel() {
            loginScreen.classList.add('hidden'); mainPanel.classList.remove('hidden');
            document.getElementById('userApiKey').innerText = API_KEY;
            fetchDevices(); fetchHacks();
        }

        function logout() { localStorage.clear(); location.reload(); }

        async function fetchDevices() {
            const res = await fetch('/api/devices', { headers: { 'x-api-key': API_KEY } });
            renderDevices(await res.json());
        }

        async function fetchHacks() {
            const res = await fetch('/api/menu', { headers: { 'x-api-key': API_KEY } });
            renderHacksMenu(await res.json());
        }

        async function addDevice() {
            const ip = prompt("IP do Dispositivo:");
            if (!ip) return;
            const port = prompt("Porta (5555):", "5555");
            const res = await fetch('/api/devices', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                body: JSON.stringify({ ip, port })
            });
            const data = await res.json();
            if(data.success) { log(`> Dispositivo ${ip} adicionado.`); fetchDevices(); }
        }

        async function injectHack(deviceId, hackId, sub) {
            const res = await fetch('/api/hacks/inject', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                body: JSON.stringify({ deviceId, hackId, subOption: sub })
            });
            const data = await res.json();
            log(`> ${data.message}`); fetchDevices();
        }

        function renderDevices(devices) {
            const container = document.getElementById('devices-list');
            container.innerHTML = '';
            devices.forEach(d => {
                const div = document.createElement('div');
                div.className = `device-card ${d.status === 'online' || d.status === 'active' ? 'online' : ''}`;
                let hacksHtml = '';
                if(d.hacks) for(const [hId, state] of Object.entries(d.hacks)) if(state.active) hacksHtml += `<span class="hack-tag active">${hId}</span>`;
                div.innerHTML = `
                    <div class="device-header"><strong>${d.ip}:${d.port}</strong><span class="status-dot" style="background:${d.status==='active' ? '#0f0' : '#ff0000'}"></span></div>
                    <div style="font-size:0.8rem; color:#888;">ID: ${d.id.substring(0,8)}...</div>
                    <div class="device-hacks">${hacksHtml || '<span style="font-size:0.8rem; color:#555">Sem hacks ativos</span>'}</div>
                    <div style="margin-top:15px; display:flex; gap:5px;">
                        <button class="btn btn-small" onclick="injectHack('${d.id}', 'headshot', 'Cabeça')">HS Auto</button>
                        <button class="btn btn-small" onclick="injectHack('${d.id}', 'esp', 'Linha')">ESP</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderHacksMenu(hacks) {
            const container = document.getElementById('hacks-container');
            container.innerHTML = '';
            hacks.forEach(h => {
                const hDiv = document.createElement('div');
                hDiv.style.marginBottom = '15px'; hDiv.style.borderBottom = '1px solid #333'; hDiv.style.paddingBottom = '10px';
                let subHtml = h.sub.map(s => `<button class="btn btn-small" style="background:#333; width:auto; padding:2px 8px; margin-right:5px;" onclick="alert('Selecione um dispositivo para aplicar ${s}')">${s}</button>`).join('');
                hDiv.innerHTML = `<div style="font-weight:bold; color:var(--primary); margin-bottom:5px;">${h.name}</div><div>${subHtml}</div>`;
                container.appendChild(hDiv);
            });
        }

        function log(msg) {
            const line = document.createElement('div');
            line.innerText = `> ${msg} [${new Date().toLocaleTimeString()}]`;
            consoleLog.appendChild(line);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        function showSection(sec) {
            document.getElementById('devices-list').classList.toggle('hidden', sec !== 'devices');
            document.getElementById('hacks-list').classList.toggle('hidden', sec !== 'hacks');
            document.getElementById('section-title').innerText = sec === 'devices' ? 'Dispositivos Conectados' : 'Catálogo de Hacks';
        }
    </script>
</body>
</html>
